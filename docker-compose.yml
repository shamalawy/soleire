# Production-shaped stack: gunicorn behind WhiteNoise, PostgreSQL with a
# persistent volume. `docker-compose.override.yml` layers development
# conveniences on top and is picked up automatically by `docker compose up`.
name: soleire

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-soleire}
      POSTGRES_USER: ${POSTGRES_USER:-soleire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Keeps the cluster's collation stable across host locales.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soleire} -d ${POSTGRES_DB:-soleire}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the compose network the database is reachable by service name.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8000}:8000"

volumes:
  pgdata:
