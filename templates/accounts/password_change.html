{% extends "base.html" %}
{% block title %}Change your password — soleire{% endblock %}
{% block robots %}noindex, nofollow{% endblock %}
{% block content %}
<h1>Change your password</h1>
<div class="card" style="max-width:32rem">
  <form method="post">
    {% csrf_token %}
    {% include "_partials/form.html" %}
    <div class="btn-row">
      <button type="submit" class="btn">Change password</button>
      <a class="btn secondary" href="{% url 'my_records' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
